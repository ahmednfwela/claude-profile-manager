version: 2

builds:
  - binary: cpm
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/jakubkontra/cpm/internal.Version={{.Version}}
      - -X github.com/jakubkontra/cpm/internal.Commit={{.ShortCommit}}

archives:
  # NOTE: no `files:` here — goreleaser silently IGNORES it for format:binary
  # (proven on the v0.5.0 assets). The channel server bundle ships INSIDE the
  # binary instead (go:embed in channel/embed.go; extracted on demand by
  # internal/channel.go extractEmbeddedBundle).
  - format: binary
    # goreleaser appends the binary's own extension for format:binary, so the
    # template must NOT add .exe itself — v0.4.0 shipped `cpm_windows_amd64.exe.exe`
    # because of the old conditional. The self-updater matches by
    # Contains("cpm_<os>_<arch>[.exe]"), so the single-extension name still matches.
    name_template: "cpm_{{ .Os }}_{{ .Arch }}"

release:
  # semantic-release creates the GitHub Release (with generated notes) before
  # goreleaser runs; keep-existing makes goreleaser only ATTACH binaries instead
  # of replacing the release body with its raw commit-list changelog.
  mode: keep-existing

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# NOTE: the upstream `brews:` block (pushing to jakubkontra/homebrew-tap) was
# removed — this fork has no such tap and the cross-repo push has no valid token,
# which would fail every tag-triggered release. Distribution here is the raw
# GitHub Release binaries consumed by `cpm upgrade` / scoop / manual copy.
